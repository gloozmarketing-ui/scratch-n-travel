name: Scratch'n'Travel Hermes — Daily Autonomous Secret Spots & Social Growth Autopilot

on:
  schedule:
    # Täglich um 06:00 Uhr UTC (08:00 Uhr MESZ)
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuelles Ausführen im GitHub Actions Dashboard

jobs:
  daily-hermes-autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Hermes Daily Secret Spots Seeder (10 Neue Spots weltweit)
        run: node scripts/hermes_daily_spots_generator.js
        env:
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run Hermes Social Growth & Ads Engine (5-Kanal Viral Autopilot)
        run: node scripts/hermes_social_growth_engine.js
        env:
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          GROWTH_WEBHOOK_URL: ${{ secrets.GROWTH_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Hermes City Brain Seeder
        run: node scripts/hermes_travel_seeder.js --cron || true
        env:
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # SNT-104/105: Hier wurde früher der Legacy-Build (04.09.2026) erzeugt und
      # per `cp` über Root-`index.html` + `dist/` geschoben. Das hat die
      # Produktion täglich mit dem Figma-Make-Default überschrieben
      # ("Figma Make App", noindex, robots.txt "Disallow: /").
      # Produktion baut ausschliesslich via deploy.yml (`vercel build`).

      - name: Commit & Push Daily Spots & Social Campaigns
        run: |
          git config --global user.name "Hermes Travel & Growth Engine"
          git config --global user.email "hermes@scratchntravel.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(hermes): daily 10 verified secret spots, authentic food & viral growth campaign [skip ci]" && git push origin main)
