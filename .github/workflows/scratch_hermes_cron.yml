name: Scratch'n'Travel Hermes â€” Automated Country & Secret Spots Seeder

on:
  schedule:
    # Jeden Montag und Donnerstag um 07:00 Uhr UTC
    - cron: '0 7 * * 1,4'
  workflow_dispatch: # Manuelles Ausführen im GitHub Dashboard

jobs:
  seed-destinations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Hermes Travel Seeder
        run: node scripts/hermes_travel_seeder.js --cron
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Build Web Application
        working-directory: ./verschiedene webseit versionen/04.09.2026
        run: |
          npm install
          npm run build

      - name: Sync Dist Artifacts
        run: |
          cp -r "verschiedene webseit versionen/04.09.2026/dist/"* dist/

      - name: Commit & Push New Destinations
        run: |
          git config --global user.name "Hermes Travel Scout"
          git config --global user.email "hermes@scratchntravel.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(hermes): auto-seed new secret spots, local eateries and tours [skip ci]" && git push)
