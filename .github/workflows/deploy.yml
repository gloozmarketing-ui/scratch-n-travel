name: Hermes Travel — Deploy (Push)

on:
  push:
    branches: [main]
  # Kein `schedule` mehr: alle Zeitplaeine liegen in hermes-automation.yml (SNT-404).
  # Dieses Workflow laeuft nur noch, wenn jemand etwas pusht oder manuell startet.
  workflow_dispatch:

jobs:
  # ─── Job 1: Qualitaets-Gate (SNT-408) ───
  # Erst pruefen, dann deployen. Ein Push, der Typecheck, Schema, UI-Audit,
  # Foto-Logik oder das Bundle-Budget verletzt, darf nicht live gehen.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: check:all (typecheck, schema, ui-audit, foto-sicherheit)
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Bundle-Budget (SNT-412)
        run: npm run check:bundle

      # Artefakt sichern (SNT-206): Der Build ist sonst nur auf dem Runner.
      # So laesst sich jederzeit nachvollziehen, was live ging, ohne lokal
      # bauen zu muessen.
      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ─── Job 2: Vercel Deploy (nur wenn das Gate gruen war) ───
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
