<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0B131F" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Compass Star / Passport Seal -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Gold Scratch Diamond -->
  <polygon points="50,18 58,42 82,50 58,58 50,82 42,58 18,50 42,42" fill="url(#goldGrad)"/>
  <!-- Center Core -->
  <circle cx="50" cy="50" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
</svg>